services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: hac_dev
      MYSQL_USER: hac
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run setup:local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup:local}
    volumes:
      - hac_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u hac -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  hac_mysql:
